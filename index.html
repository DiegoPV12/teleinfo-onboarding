<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Teleinfo · Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body data-scene="welcome">

  <div class="bg" aria-hidden="true">
    <s class="b1"></s><s class="b2"></s><s class="b3"></s><s class="b4"></s>
  </div>

  <div class="link" data-el="link" hidden>
    <s></s><span data-el="linkTxt">Reconectando</span>
  </div>

  <main class="stage">

    <!-- 1 · BIENVENIDA -->
    <section class="scene center" data-scene="welcome">
      <div class="head fade" data-el="welcomeHead">
        <div class="listen show live wait">
          <div class="orb"><i></i><b></b></div>
          <p data-el="waitTxt">Esperando a que alguien se acerque</p>
        </div>
      </div>
      <div class="body">
        <h1 class="hero"><em data-el="heroLine1"></em><em data-el="heroLine2"></em></h1>
        <p class="lede" data-el="lede"></p>
        <!-- Respaldo: si la detección falla, se entra a mano -->
        <div class="fallback" data-el="fallback">
          <div class="slider" data-el="slider" role="button" tabindex="0" aria-label="Deslice para comenzar">
            <div class="glow"></div>
            <div class="fill"><i></i><div class="sheen"></div></div>
            <div class="lbl">Deslice para comenzar</div>
            <div class="knob">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h13M13 6l6 6-6 6"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2 · PASO (identidad · trabajo · contacto) -->
    <section class="scene" data-scene="step">
      <div class="head">
        <div class="steps" data-el="stepBar"></div>
        <div class="listen show live">
          <div class="orb"><i></i><b></b></div>
          <p data-el="stepListen">Le escucho</p>
        </div>
      </div>
      <div class="body">
        <p class="eyebrow" data-el="stepEyebrow"></p>
        <h2 class="title" data-el="stepTitle"></h2>
        <div class="form" data-el="stepForm"></div>
        <button class="btn line" data-el="stepSkip" hidden>Prefiero omitir estos datos</button>
        <p class="note" data-el="stepHint"></p>
      </div>
      <div class="foot">
        <button class="btn line" data-el="stepBack" hidden>Volver atrás</button>
        <button class="btn" data-el="stepVerify">Siguiente</button>
      </div>
    </section>

    <!-- 3 · FOTOS -->
    <section class="scene" data-scene="photos">
      <div class="head">
        <div class="steps" data-el="photoBar"></div>
        <div class="listen show live">
          <div class="orb"><i></i><b></b></div>
          <p data-el="photoListen">Colóquese frente a la cámara</p>
        </div>
      </div>
      <div class="body">
        <p class="eyebrow" data-el="photoEyebrow"></p>
        <h2 class="title" data-el="photoTitle"></h2>
        <div class="shots" data-el="shots"></div>
      </div>
      <div class="foot">
        <button class="btn line" data-el="photoBack">Volver atrás</button>
        <button class="btn" data-el="photoVerify">Confirmar fotos</button>
      </div>
    </section>

    <!-- 4 · LISTO -->
    <section class="scene" data-scene="done">
      <div class="body">
        <h2 class="hero"><em data-el="doneName">Listo.</em></h2>
        <p class="lede" data-el="doneLede"></p>
        <div class="badge">
          <b data-el="doneFull">—</b>
          <span data-el="doneRole">—</span>
          <div class="strip"></div>
        </div>
      </div>
      <div class="foot">
        <div class="ring"><s></s><span>Imprimiendo su credencial</span></div>
      </div>
    </section>

  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
